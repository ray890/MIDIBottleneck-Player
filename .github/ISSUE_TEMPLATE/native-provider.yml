name: Native-provider compatibility
description: Report a bounded WinMM or KDMAPI compatibility issue.
title: "[Provider] "
labels: [compatibility]
body:
  - type: input
    id: build
    attributes:
      label: Build and executable architecture
      placeholder: Build 23, x64
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Output API and provider
      placeholder: WinMM or KDMAPI; provider name/version/architecture
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Simulator settings and bounded reproduction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Separate application errors from audible observations. Redact personal paths and do not attach provider binaries.
