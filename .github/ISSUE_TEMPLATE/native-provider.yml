name: Native-provider compatibility
description: Report a bounded WinMM, Direct WinMM or KDMAPI compatibility issue.
title: "[Provider] "
labels: [compatibility]
body:
  - type: input
    id: build
    attributes:
      label: Build and architecture
      placeholder: "2.0.0, x64 (or x86, or XP; see About)"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Output API and provider
      placeholder: WinMM, Direct WinMM or KDMAPI; provider name/version/architecture
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Simulator settings and bounded reproduction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Separate application errors from audible observations. Redact personal paths and do not attach provider binaries.
